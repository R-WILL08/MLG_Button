<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <header>
        <h1 id="head">Sound Switch</h1>
        <div id="raspberry status">
            <p>Raspberry Pi Status: <span id="statusText">Disconnected</span></p>
        </div>
    </header>
</head>
<body>
    <div id="soundboard">
        <div id="triggerContainer">
            <button id="trigger">
                <img src="image.png" alt="Sound Button">
            </button>
            <div id="selectedSoundLabel">Selected Sound: None</div>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
            <button id="stopButton">Stop</button>
        </div>
        <div id="soundselect" class="side-list" role="navigation" aria-label="Sound list">
            <ul>
                <li><button type="button" class="sound-item" data-sound="1.mp3">Sound 1</button></li>
                <li><button type="button" class="sound-item" data-sound="2.mp3">Sound 2</button></li>
                <li><button type="button" class="sound-item" data-sound="3.mp3">Sound 3</button></li>
                
            </ul>
        </div>
    </div>

</body>
<footer>
    <p>© 2024 Sound Switch. All rights reserved.</p>
</footer>
<script src="script.js"></script>
</html>
